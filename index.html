<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battleship</title>
<script defer src="main.js"></script></head>
<body>
    <p id="status"></p>
    <button id="rotate">Rotate ship</button>
    <div id="ship-dock"></div>
    <div id="confirm-controls">
        <button id="start">Start game</button>
        <button id="reset">Reset placement</button>
    </div>
    <button id="play-again">Play again</button>
    <div class="game-container">
        <div class="player-board">
            <h3>Player Board</h3>
            <div id="human-grid" class="grid"></div>
        </div>

        <div class="player-board">
            <h3>Enemy Board</h3>
            <div id="computer-grid" class="grid"></div>
        </div>
    </div>
    <div id="mode-screen" class="overlay">
        <h2>Battleship</h2>
        <button id="mode-1p">1 Player (vs Computer)</button>
        <button id="mode-2p">2 Players (pass and play)</button>
    </div>
    <div id="switch-screen" class="overlay">
        <p id="switch-text"></p>
        <button id="switch-ready">Ready</button>
    </div>
</body>
</html>
